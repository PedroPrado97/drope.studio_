:root{--g3:#3B903F;--g2:#6DC249;--font:"General Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#fff;color:#000;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:auto}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ececec}
.nav{display:flex;justify-content:flex-start;align-items:center;height:72px}
.back{font-size:15px;font-weight:500;color:#215733}
.back:hover{color:var(--g3)}
.info{background:#161616;color:#fff;padding:96px 0}
.info h1{font-size:clamp(36px,5vw,64px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.label{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--g2);margin:56px 0 16px}
.tag{font-size:13px;font-weight:600;letter-spacing:.12em;color:#fff;margin-bottom:14px}
.info p{font-size:17px;color:#d6d6d6;max-width:72ch}
.info .deliv{margin-top:20px;color:#fff}
.lang{margin-top:64px;padding-top:56px;border-top:1px solid #2a2a2a}
.gallery{display:block;padding:0;margin:0;width:100%}
.shot{margin:0;width:100%}
.credits{padding:96px 0}
.credits h2{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.02em;margin-bottom:40px}
.credits dl{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.credits dt{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--g3);margin-bottom:6px}
.credits dd{font-size:17px}
.credits a.ig{color:var(--g3);border-bottom:1px solid var(--g3)}
footer{background:#000;color:#8a8a8a;padding:28px 0;font-size:13px;text-align:center}
@media (max-width:900px){ .credits dl{grid-template-columns:1fr 1fr} }
@media (max-width:600px){ .gallery{columns:1} .credits dl{grid-template-columns:1fr} .info{padding:64px 0} }

.zoomable{cursor:zoom-in}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.lightbox button{position:absolute;top:18px;right:22px;background:none;border:none;color:#fff;font-size:36px;line-height:1;cursor:pointer;font-family:inherit}

.lightbox .seta{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border:none;color:#fff;font-size:56px;line-height:1;width:56px;height:72px;border-radius:8px;cursor:pointer;font-family:inherit}
.lightbox .seta:hover{background:rgba(255,255,255,.2)}
.lightbox .esq{left:14px}
.lightbox .dir{right:14px}
.lightbox .fechar{font-size:36px}
.lightbox .contador{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#bbb;font-size:14px;letter-spacing:.08em}
@media (max-width:600px){ .lightbox .seta{width:44px;height:56px;font-size:40px} }

/* Cabeçalho com botão Fale conosco e rolagem até o contato */
header .nav{justify-content:space-between;gap:16px}
#contato{scroll-margin-top:72px}

/* Botão igual ao da home: contorno circular e preenchimento que desliza no hover */
:root{--g4:#215733}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-block;padding:13px 24px;border:1.5px solid var(--g3);border-radius:999px;color:var(--g4);background:transparent;font-weight:600;font-size:15px;line-height:1.2;transition:color .35s ease,border-color .35s ease,transform .25s ease}
.btn::before{content:"";position:absolute;inset:0;background:var(--g3);transform:translateX(-101%);transition:transform .45s cubic-bezier(.2,.7,.2,1);z-index:-1}
.btn:hover{background:transparent;color:#fff;transform:translateY(-2px)}
.btn:hover::before{transform:translateX(0)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--g3);outline-offset:4px}
header .nav .btn{padding:13px 24px;font-size:15px}
@media (prefers-reduced-motion:reduce){ .btn,.btn::before{transition:none} }

/* Contatos e rodapé no padrão da home */
.ct{background:#000;color:#fff;padding:112px 0 96px;font-family:"General Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.ct .ct-logo{width:min(380px,80%);height:auto;display:block;margin-bottom:72px}
.ct h2{font-size:clamp(36px,5.2vw,60px);font-weight:700;line-height:1.05;letter-spacing:-.025em;color:#fff}
.ct .ct-intro{margin-top:22px;font-size:17px;line-height:1.6;color:#d6dcd8}
.ct .ct-mail{display:inline-block;margin-top:44px;font-size:clamp(22px,3.2vw,34px);font-weight:700;color:#6DC249;transition:color .2s}
.ct .ct-mail:hover{color:#fff}
.ct .ct-social{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.ct .ct-social a{display:inline-flex;align-items:center;gap:10px;border:1px solid #2a2a2a;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:600;color:#fff;transition:border-color .25s,color .25s}
.ct .ct-social a:hover{border-color:#6DC249;color:#6DC249}
.ct .ct-social a:focus-visible,.ct-foot a:focus-visible{outline:2px solid #6DC249;outline-offset:4px}
.ct .ct-social svg{flex-shrink:0}
.ct-foot{background:#000;border-top:1px solid #1b1b1b;padding:30px 0;color:#8a938d;font-size:14px;font-family:"General Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.ct-foot .row{max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.ct-foot img{height:22px;width:auto}
.ct-foot .r{text-align:right}
.ct-foot a{color:#9fc4ea}
@media (max-width:900px){
  .ct{padding:88px 0 72px}
  .ct .ct-logo{margin-bottom:56px}
}
@media (max-width:600px){
  .ct-foot .row{grid-template-columns:1fr;text-align:center;justify-items:center}
  .ct-foot .r{text-align:center}
}

/* ===== Versão preta: fundo grafite degradê, textos e ícones brancos ===== */

header{background:rgba(10,10,10,.92);border-bottom:1px solid #222}
.nav ul a{color:#fff}

.back{color:#fff}

.btn{color:#fff;border-color:#6DC249}

.btn:hover{color:#000}
.btn.solid{background:#6DC249;color:#000}

.eyebrow,.sob-sub,.sob-item h3 .num,.card .num,.step .n,.sob h2 .g,h1 span{color:#6DC249}
h1,h2,h3,.sob-titulo,.sob-item h3,.work-head h2,.credits h2{color:#fff}
p,.lead,.sob-texto,.card p,.step p{color:#e6e6e6}
.resposta,.contato-intro,.ct-intro{color:#cfd6d1}
.hero-visual{background:#fff}
.muted{background:transparent}
.card{background:transparent;border-color:#2a2a2a}
.sob-item{border-top-color:#2a2a2a}
.sob-lista-4 .sob-item,.step{border-top-color:#6DC249}
.sob-bloco-foto .foto{background:#111}
.credits dt{color:#6DC249}
.credits dd{color:#fff}

.ct h2{color:#fff}
.ct .ct-mail{color:#6DC249}

.ct-foot{background:transparent;border-top-color:#222;color:#9aa39d}
.ct-foot a{color:#6DC249}

/* Fundo: luz suave e difusa em verde #12312C e grafite #333333, sem filtro (sem pixel) e com grão fino */
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:-2;
  background:
    radial-gradient(60% 55% at 15% 25%, rgba(18,49,44,.50) 0%, rgba(18,49,44,.26) 38%, rgba(18,49,44,.08) 68%, rgba(18,49,44,0) 100%),
    radial-gradient(55% 50% at 86% 44%, rgba(51,51,51,.30) 0%, rgba(51,51,51,.13) 44%, rgba(51,51,51,0) 100%),
    radial-gradient(60% 55% at 30% 86%, rgba(18,49,44,.40) 0%, rgba(18,49,44,.18) 44%, rgba(18,49,44,0) 100%),
    radial-gradient(50% 45% at 92% 92%, rgba(51,51,51,.22) 0%, rgba(51,51,51,0) 100%);
